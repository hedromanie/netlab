[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netlab"
version = "0.1.0"
description = "Educational network attack lab platform (L2-L4)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "NetLab Contributors" }
]
dependencies = [
    "scapy>=2.5.0",
    "typer[all]>=0.12.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
netlab = "netlab.cli:app"
netlab-gui = "netlab.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["netlab*"]

[tool.ruff]
line-length = 100
target-version = "py311"
